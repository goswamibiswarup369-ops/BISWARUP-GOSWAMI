<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<head>
  <meta charset="UTF-8">
  <title>Women's Safety Alert</title>
</head>
<body>

  <h1>🚨 Women's Safety Alert 🚨</h1>
  <p id="status">Press the button if you feel unsafe.</p>
  <button id="alertBtn">SEND ALERT</button>

  <script>
    const btn = document.getElementById('alertBtn');
    const statusEl = document.getElementById('status');

    btn.addEventListener('click', () => {
      statusEl.textContent = "Fetching your location...";

      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        fetch("http://localhost:3000/api/alert", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lat, lon })
        })
        .then(res => res.json())
        .then(data => {
          statusEl.textContent = "✅ Alert sent successfully!";
        })
        .catch(err => {
          statusEl.textContent = "❌ Error sending alert";
        });

      });
    });
  </script>

</body>
</html>
